server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        client_max_body_size 257m;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_origin http://backend:8080;
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 只信这一层代理:X-Forwarded-For 用真实来源地址覆盖,不追加客户端自带的值,
        # 否则登录防暴力破解按 IP 的计数会被伪造头绕过。前面再加负载均衡时改成只信任它的地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 积木编辑器(scratch-editor 容器)反代。本 location 自带 add_header 后，
    # server 级的 CSP/X-Frame-Options 在此不再继承——这是有意的：编辑器页面
    # 需要放宽的专属 CSP(实测清单见 scratch-editor/README.md)：
    #   'unsafe-eval'  — scratch-parser 的 ajv 运行时生成校验函数，缺了工程加载必挂
    #   frame-ancestors 'self' — 只允许平台自己以 iframe 嵌入
    location /scratch/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $editor_origin http://scratch-editor:8080;
        rewrite ^/scratch/(.*)$ /$1 break;
        proxy_pass $editor_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob:; object-src 'none'; frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
