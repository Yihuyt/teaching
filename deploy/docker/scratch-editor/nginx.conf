server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index teaching.html;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # 构建产物均带内容 hash 或随版本发布，允许长缓存；HTML 不缓存
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }
    location /static/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
